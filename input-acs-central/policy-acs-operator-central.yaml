apiVersion: v1
kind: Namespace
metadata:
  name: stackrox
---
apiVersion: v1
kind: Namespace
metadata:
  name: rhacs-operator
---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: OperatorPolicy
metadata:
  name: operatorpolicy-rhacs-operator
spec:
  remediationAction: enforce
  severity: high
  complianceType: musthave
  upgradeApproval: Automatic
  operatorGroup:
    name: rhacs-operator-group
    namespace: rhacs-operator
  subscription:
    channel: stable
    name: rhacs-operator
    namespace: rhacs-operator
    source: redhat-operators
    sourceNamespace: openshift-marketplace
---
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  namespace: stackrox
  name: stackrox-central-services
spec:
  central:
    exposure:
      loadBalancer:
        enabled: false
        port: 443
      nodePort:
        enabled: false
      route:
        enabled: true
    persistence:
      persistentVolumeClaim:
        claimName: stackrox-db
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    db:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi            
  egress:
    connectivityPolicy: Online
  scannerV4:
    db:
      persistence:
        persistentVolumeClaim:
          claimName: scanner-v4-db
      resources:
        requests:
          cpu: 250m
          memory: 512Mi               
    indexer:
      scaling:
        autoScaling: Disabled
        maxReplicas: 5
        minReplicas: 2
        replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 500Mi             
    matcher:
      scaling:
        autoScaling: Disabled
        maxReplicas: 5
        minReplicas: 2
        replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi    
        limits:
          cpu: 4
          memory: 10Gi                   
    scannerComponent: Default
  scanner:
    analyzer:
      scaling:
        autoScaling: Disabled
        maxReplicas: 5
        minReplicas: 2
        replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi             
    scannerComponent: Enabled
customize:
    envVars:
      - name: ROX_SCANNER_V4_RED_HAT_LAYERS_RED_HAT_VULNS_ONLY
        value: 'true'    
